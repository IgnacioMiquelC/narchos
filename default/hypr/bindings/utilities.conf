# Menus
bindd = SUPER, SPACE, Launch apps, exec, narchos-launch-walker
bindd = SUPER CTRL, E, Emoji picker, exec, narchos-launch-walker -m Emojis
bindd = SUPER ALT, SPACE, narchos menu, exec, narchos-menu
bindd = SUPER, ESCAPE, Power menu, exec, narchos-menu system
bindld = , XF86PowerOff, Power menu, exec, narchos-menu system
bindd = SUPER, K, Show key bindings, exec, narchos-menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, narchos-toggle-waybar
bindd = SUPER CTRL, SPACE, Next background in theme, exec, narchos-theme-bg-next
bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, narchos-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, narchos-toggle-idle

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, narchos-toggle-nightlight

# Control Apple Display brightness
bindd = CTRL, F1, Apple Display brightness down, exec, narchos-cmd-apple-display-brightness -5000
bindd = CTRL, F2, Apple Display brightness up, exec, narchos-cmd-apple-display-brightness +5000
bindd = SHIFT CTRL, F2, Apple Display full brightness, exec, narchos-cmd-apple-display-brightness +60000

# Captures
bindd = SUPER, PRINT, Screenshot with Editing, exec, omarchy-cmd-screenshot
bindd = SUPER SHIFT, S, Screenshot to Clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = ALT, PRINT, Screenrecording, exec, omarchy-menu screenrecord
bindd = , PRINT, Color picking, exec, pkill hyprpicker || hyprpicker -a

# Clipboard
bindd = SUPER, V, Clipboard, exec, [float] copyq toggle
